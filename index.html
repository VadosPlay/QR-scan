<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Security Scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>QR Security Scanner</h1>

    <!-- Блок кнопок -->
    <div class="actions">

        <!-- Только для ПК -->
        <button id="pasteBtn" class="pc-only">Вставить из буфера</button>

        <!-- Только для телефона -->
        <button id="cameraBtn" class="mobile-only">Сканировать камерой</button>

        <!-- Общие -->
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Видео с камеры -->
    <div id="cameraBox" class="mobile-only hidden">
        <video id="video" autoplay></video>
    </div>

    <!-- Результат -->
    <div id="resultBox" class="result neutral">Ожидание данных...</div>

    <!-- История -->
    <h2>История</h2>
    <ul id="historyList"></ul>

</div>

<script src="jsQR.js"></script>
<script src="script.js"></script>
</body>
</html>
