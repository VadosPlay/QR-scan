<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Security Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>QR Security Check</h1>

  <div class="scan-section">
    <h2>Проверка QR-кода</h2>
    <input type="file" id="fileInput" accept="image/*">
    <button id="scanCamera">Сканировать камерой</button>
    <button id="pasteBtn">Вставить из буфера</button>
  </div>

  <video id="cameraStream" autoplay playsinline></video>

  <div class="result" id="resultBox">Здесь будет результат</div>

  <h2>История проверок</h2>
  <ul id="history"></ul>
</div>

<script src="jsQR.js"></script>
<script src="script.js"></script>
</body>
</html>
