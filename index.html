<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Security Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <h1 class="title">QR Security Check</h1>

    <div class="card">
        <h2>Проверка QR-кода</h2>

        <label class="file-input">
            <input type="file" id="fileInput" accept="image/*">
            <span>📁 Загрузить изображение</span>
        </label>

        <button id="scanCamera" class="btn">📷 Сканировать камерой</button>
        <button id="pasteBtn" class="btn">📋 Вставить из буфера</button>

        <video id="cameraStream" autoplay playsinline></video>

        <div id="resultBox" class="result">Здесь будет результат</div>
    </div>

    <div class="card history-card">
        <h2>История проверок</h2>
        <ul id="history" class="history-list"></ul>
    </div>
</div>

<script src="jsQR.js"></script>
<script src="script.js"></script>
</body>
</html>
